server.port=8080
spring.application.name=bus-tracking-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/BusTracking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.indent_output=true
server.error.include-message=always
server.error.include-stacktrace=never
logging.level.org.springframework.web=INFO
logging.level.com.skylinetransit=INFO
location.api.key=${LOCATION_API_KEY:}
