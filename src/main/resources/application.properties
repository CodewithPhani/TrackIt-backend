server.port=8080
spring.application.name=bus-tracking-backend

# H2 Database Settings
spring.datasource.url=jdbc:h2:mem:bustrackingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console for DB inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON formatting
spring.jackson.serialization.indent_output=true

# Logging & Error Details
server.error.include-message=always
server.error.include-stacktrace=always
logging.level.org.springframework.web=INFO
logging.level.com.skylinetransit=DEBUG

# Real-Time Bus Location & Geocoding API Key
location.api.key=c2d1ebec4d3af3

